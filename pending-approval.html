<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Pending - EnrichMe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg-alt: #f5f4f1;
      --ink: #16130f;
      --ink-soft: #5c584f;
      --ink-faint: #8a857a;
      --border: #e7e3dc;
      --accent: #de3341;
      --accent-dark: #a3202b;
      --accent-tint: #fdeceb;
      --black: #16130f;
      --black-hover: #322d26;
      --logo-brown: #712b13;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    a, button { color: inherit; font-family: inherit; }

    .auth-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .logo { display: flex; align-items: center; gap: 0.65rem; font-size: 1.15rem; font-weight: 700; color: var(--logo-brown); text-decoration: none; }
    .logo-icon { width: 30px; height: 30px; flex-shrink: 0; }

    .back-home { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); text-decoration: none; transition: color 0.2s; background: none; border: none; cursor: pointer; }
    .back-home:hover { color: var(--accent); }

    @media (max-width: 700px) { .auth-topbar { padding: 1.1rem 1.5rem; } }

    .status-shell { min-height: calc(100dvh - 65px); display: flex; align-items: center; justify-content: center; background: var(--bg-alt); padding: 2.5rem 2rem; }

    .status-box { background: #ffffff; border: 1px solid var(--border); border-radius: 1rem; padding: 2.75rem 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 10px 40px rgba(22, 19, 15, 0.06); text-align: center; }

    .status-icon { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1.25rem; }
    .status-icon.pending { background: var(--accent-tint); }
    .status-icon.rejected { background: #f1f5f9; }

    .status-box h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.75rem; }
    .status-box p { color: var(--ink-soft); font-size: 0.92rem; line-height: 1.6; margin-bottom: 0.9rem; }
    .status-box p:last-of-type { margin-bottom: 1.75rem; }
    .status-box a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .status-box a:hover { color: var(--accent-dark); }

    .status-pill { display: inline-flex; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.95rem; font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 1.25rem; }

    .status-actions { display: flex; flex-direction: column; gap: 0.65rem; }

    .btn-check { width: 100%; padding: 0.8rem; background: var(--black); color: white; border: none; border-radius: 999px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-check:hover { background: var(--black-hover); }

    .btn-signout { width: 100%; padding: 0.75rem; background: transparent; border: 1px solid var(--border); color: var(--ink); border-radius: 999px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn-signout:hover { border-color: var(--ink); }
  </style>
</head>
<body>
  <div class="auth-topbar">
    <a href="index.html" class="logo">
      <svg class="logo-icon" viewBox="8 8 98 94" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="55" cy="55" r="42" fill="none" stroke="#712B13" stroke-width="8" stroke-linecap="round" stroke-dasharray="230 34" stroke-dashoffset="20"/>
        <path d="M92,33 Q101,45 95,52 Q97,43 89,41 Q86,48 92,53 Q80,50 80,40 Q80,34 92,33 Z" fill="#712B13"/>
      </svg>
      <span>EnrichMe</span>
    </a>
    <button type="button" class="back-home" onclick="signOutAndRedirect('index.html')">← Sign out</button>
  </div>

  <div class="status-shell">
    <div class="status-box" id="statusBox">
      <p style="margin:0;color:var(--ink-faint);">Checking your account status…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    function renderPending(email) {
      document.getElementById('statusBox').innerHTML =
        '<div class="status-icon pending">⏳</div>' +
        '<div class="status-pill">Early access - first 100 users</div>' +
        '<h2>You\'re on the list</h2>' +
        '<p>Thanks for signing up. EnrichMe is free while we onboard our first 100 users by hand, and we\'ve let our team know you\'re waiting.</p>' +
        '<p>You\'ll get an email at <b>' + email + '</b> the moment your account is activated - usually the same day. Questions in the meantime? Write to <a href="mailto:admin@enrichme.app">admin@enrichme.app</a>.</p>' +
        '<div class="status-actions">' +
          '<button type="button" class="btn-check" onclick="location.reload()">Check again</button>' +
          '<button type="button" class="btn-signout" onclick="signOutAndRedirect(\'index.html\')">Sign out</button>' +
        '</div>';
    }

    function renderRejected() {
      document.getElementById('statusBox').innerHTML =
        '<div class="status-icon rejected">✕</div>' +
        '<h2>Request not approved</h2>' +
        '<p>Your request to join EnrichMe wasn\'t approved for early access at this time.</p>' +
        '<p>If you think this is a mistake, write to <a href="mailto:admin@enrichme.app">admin@enrichme.app</a>.</p>' +
        '<div class="status-actions">' +
          '<button type="button" class="btn-signout" onclick="signOutAndRedirect(\'index.html\')">Sign out</button>' +
        '</div>';
    }

    (async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('status, email')
        .eq('id', session.user.id)
        .single();

      if (error || !profile) {
        document.getElementById('statusBox').innerHTML = '<p style="margin:0;">Could not load your account status. Please try refreshing.</p>';
        return;
      }

      if (profile.status === 'approved') {
        window.location.href = 'dashboard.html';
        return;
      }

      if (profile.status === 'rejected') {
        renderRejected();
      } else {
        renderPending(profile.email || session.user.email);
      }
    })();
  </script>
</body>
</html>
