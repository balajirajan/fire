<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obligations Calc Tests - EnrichMe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; padding: 2rem; }
    h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.3rem; }
    p.sub { color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .summary { font-size: 0.95rem; font-weight: 700; padding: 0.9rem 1.1rem; border-radius: 0.6rem; margin-bottom: 1.25rem; }
    .summary.pass { background: #ecfdf5; color: #059669; }
    .summary.fail { background: #fef2f2; color: #dc2626; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.6rem; overflow: hidden; }
    th, td { text-align: left; padding: 0.6rem 0.8rem; font-size: 0.82rem; border-bottom: 1px solid #f1f5f9; }
    th { background: #f1f5f9; font-weight: 700; }
    tr.pass td.status { color: #059669; font-weight: 700; }
    tr.fail td.status { color: #dc2626; font-weight: 700; }
    td.detail { color: #64748b; font-family: ui-monospace, monospace; font-size: 0.78rem; }
  </style>
</head>
<body>
  <h1>Obligations Calculation — Unit Tests</h1>
  <p class="sub">Runs js/obligations-calc.js in an actual browser and asserts results, since there is no Node/Jest available in this environment. Open this file directly to check pass/fail.</p>
  <div class="summary" id="summary">Running...</div>
  <table>
    <thead><tr><th style="width:40%;">Test</th><th style="width:10%;">Status</th><th>Detail</th></tr></thead>
    <tbody id="resultsBody"></tbody>
  </table>

  <script src="js/obligations-calc.js"></script>
  <script>
    var results = [];

    function assert(name, condition, detail) {
      results.push({ name: name, pass: !!condition, detail: detail || '' });
    }

    function d(dateStr) { return new Date(dateStr + 'T00:00:00'); }
    function dateEq(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    function fmt(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }

    // --- computeNextDueDate: recurrence = none ---
    (function () {
      var next = ObligationsCalc.computeNextDueDate(d('2026-03-15'), 'none', null, d('2026-03-20'));
      assert('none: due date unchanged regardless of completion date', dateEq(next, d('2026-03-15')), 'got ' + fmt(next));
    })();

    // --- computeNextDueDate: recurrence = annual, calendar-anchored (late completion) ---
    (function () {
      var next = ObligationsCalc.computeNextDueDate(d('2026-03-15'), 'annual', null, d('2026-03-20'));
      assert('annual: anchors to CURRENT due date + 1y, not completion date (completed 5 days late)', dateEq(next, d('2027-03-15')), 'got ' + fmt(next));
    })();

    // --- computeNextDueDate: recurrence = annual, Feb 29 leap-year edge case ---
    (function () {
      var next = ObligationsCalc.computeNextDueDate(d('2024-02-29'), 'annual', null, d('2024-02-29'));
      assert('annual: Feb 29 rolls to Mar 1 in the following non-leap year', dateEq(next, d('2025-03-01')), 'got ' + fmt(next));
    })();

    // --- computeNextDueDate: recurrence = custom_interval_days, early completion shifts next date earlier ---
    (function () {
      var next = ObligationsCalc.computeNextDueDate(d('2026-03-15'), 'custom_interval_days', 365, d('2026-03-01'));
      assert('custom_interval_days: early completion (14 days early) shifts next due date earlier too', dateEq(next, d('2027-03-01')), 'got ' + fmt(next));
    })();

    // --- computeNextDueDate: recurrence = custom_interval_days, late completion shifts next date later ---
    (function () {
      var next = ObligationsCalc.computeNextDueDate(d('2026-03-15'), 'custom_interval_days', 30, d('2026-03-25'));
      assert('custom_interval_days: late completion shifts next due date later too', dateEq(next, d('2026-04-24')), 'got ' + fmt(next));
    })();

    // --- completeObligation: sets last_completed_date + recomputes due_date together ---
    (function () {
      var result = ObligationsCalc.completeObligation(d('2026-06-01'), 'custom_interval_days', 180, d('2026-06-01'));
      assert('completeObligation: last_completed_date set to completion date', dateEq(result.lastCompletedDate, d('2026-06-01')), 'got ' + fmt(result.lastCompletedDate));
      assert('completeObligation: due_date recomputed per recurrence', dateEq(result.dueDate, d('2026-11-28')), 'got ' + fmt(result.dueDate));
    })();

    (function () {
      var result = ObligationsCalc.completeObligation(d('2026-06-01'), 'none', null, d('2026-06-01'));
      assert('completeObligation: recurrence=none still sets last_completed_date', dateEq(result.lastCompletedDate, d('2026-06-01')), 'got ' + fmt(result.lastCompletedDate));
      assert('completeObligation: recurrence=none leaves due_date unchanged', dateEq(result.dueDate, d('2026-06-01')), 'got ' + fmt(result.dueDate));
    })();

    // --- computeObligationStatus ---
    (function () {
      var status = ObligationsCalc.computeObligationStatus(d('2026-04-01'), [{ days_before_due: 30 }, { days_before_due: 7 }], d('2026-04-05'));
      assert('status: today after due_date is overdue', status === 'overdue', 'got ' + status);
    })();

    (function () {
      var status = ObligationsCalc.computeObligationStatus(d('2026-04-01'), [{ days_before_due: 30 }, { days_before_due: 7 }], d('2026-04-01'));
      assert('status: today exactly on due_date is NOT overdue ("after", not "on or after")', status !== 'overdue', 'got ' + status);
    })();

    (function () {
      var status = ObligationsCalc.computeObligationStatus(d('2026-04-01'), [{ days_before_due: 30 }, { days_before_due: 7 }], d('2026-03-10'));
      assert('status: 22 days before due, inside the 30-day window, is due_soon', status === 'due_soon', 'got ' + status);
    })();

    (function () {
      var status = ObligationsCalc.computeObligationStatus(d('2026-04-01'), [{ days_before_due: 30 }, { days_before_due: 7 }], d('2026-02-01'));
      assert('status: 59 days before due, outside every window, is upcoming', status === 'upcoming', 'got ' + status);
    })();

    (function () {
      var status = ObligationsCalc.computeObligationStatus(d('2026-04-01'), [], d('2026-03-31'));
      assert('status: no reminder windows at all defaults to upcoming (until overdue)', status === 'upcoming', 'got ' + status);
    })();

    // --- isWindowEntered ---
    (function () {
      var entered = ObligationsCalc.isWindowEntered(d('2026-04-01'), 7, d('2026-03-25'));
      assert('isWindowEntered: exactly 7 days before due counts as entered', entered === true, 'got ' + entered);
    })();

    (function () {
      var entered = ObligationsCalc.isWindowEntered(d('2026-04-01'), 7, d('2026-03-24'));
      assert('isWindowEntered: 8 days before due does not count as entered yet', entered === false, 'got ' + entered);
    })();

    // --- defaultReminderWindowsForCategory ---
    (function () {
      var windows = ObligationsCalc.defaultReminderWindowsForCategory('tax');
      assert('defaultReminderWindows: tax defaults to 60/30/7 per spec example', JSON.stringify(windows) === JSON.stringify([60, 30, 7]), 'got ' + JSON.stringify(windows));
    })();

    (function () {
      var windows = ObligationsCalc.defaultReminderWindowsForCategory('subscription');
      assert('defaultReminderWindows: subscription defaults to 3 per spec example', JSON.stringify(windows) === JSON.stringify([3]), 'got ' + JSON.stringify(windows));
    })();

    (function () {
      var windows = ObligationsCalc.defaultReminderWindowsForCategory('made_up_category');
      assert('defaultReminderWindows: unknown category falls back to "other" defaults', JSON.stringify(windows) === JSON.stringify([7]), 'got ' + JSON.stringify(windows));
    })();

    (function () {
      var w1 = ObligationsCalc.defaultReminderWindowsForCategory('tax');
      w1.push(999);
      var w2 = ObligationsCalc.defaultReminderWindowsForCategory('tax');
      assert('defaultReminderWindows: returns a fresh copy each call, not a shared mutable array', w2.length === 3, 'got ' + JSON.stringify(w2));
    })();

    // --- mapObligationCategoryToTransactionCategory ---
    (function () {
      var mapped = ObligationsCalc.mapObligationCategoryToTransactionCategory('insurance');
      assert('categoryMap: insurance maps to bills', mapped === 'bills', 'got ' + mapped);
    })();

    (function () {
      var mapped = ObligationsCalc.mapObligationCategoryToTransactionCategory('maintenance');
      assert('categoryMap: maintenance maps to other', mapped === 'other', 'got ' + mapped);
    })();

    // --- render ---
    var body = document.getElementById('resultsBody');
    var passCount = 0;
    results.forEach(function (r) {
      if (r.pass) passCount++;
      var tr = document.createElement('tr');
      tr.className = r.pass ? 'pass' : 'fail';
      tr.innerHTML = '<td>' + r.name + '</td><td class="status">' + (r.pass ? 'PASS' : 'FAIL') + '</td><td class="detail">' + r.detail + '</td>';
      body.appendChild(tr);
    });

    var summary = document.getElementById('summary');
    var allPass = passCount === results.length;
    summary.className = 'summary ' + (allPass ? 'pass' : 'fail');
    summary.textContent = passCount + ' / ' + results.length + ' tests passed' + (allPass ? ' — all green.' : ' — see failures below.');
  </script>
</body>
</html>
