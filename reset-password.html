<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EnrichMe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg-alt: #f5f4f1;
      --ink: #16130f;
      --ink-soft: #5c584f;
      --ink-faint: #8a857a;
      --border: #e7e3dc;
      --accent: #de3341;
      --accent-dark: #a3202b;
      --black: #16130f;
      --black-hover: #322d26;
      --logo-brown: #712b13;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    a, button { color: inherit; font-family: inherit; }

    .auth-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--logo-brown);
      text-decoration: none;
    }

    .logo-icon { width: 30px; height: 30px; flex-shrink: 0; }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-soft);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-home:hover { color: var(--accent); }

    @media (max-width: 700px) {
      .auth-topbar { padding: 1.1rem 1.5rem; }
    }

    .reset-shell {
      min-height: calc(100dvh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-alt);
      padding: 2.5rem 1.5rem;
    }

    .login-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(22, 19, 15, 0.06);
    }

    .login-box h2 { font-size: 1.6rem; margin-bottom: 0.5rem; font-weight: 700; color: var(--ink); }
    .login-box .subtitle { color: var(--ink-faint); font-size: 0.92rem; margin-bottom: 1.75rem; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.9rem; margin-bottom: 0.4rem; color: var(--ink); font-weight: 500; }
    .form-group input {
      width: 100%; padding: 0.75rem 1rem; background: var(--bg-alt);
      border: 1px solid var(--border); border-radius: 0.5rem; color: var(--ink);
      font-size: 0.95rem; transition: all 0.3s;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); background: #ffffff; box-shadow: 0 0 0 3px rgba(222, 51, 65, 0.1); }

    .signin-btn {
      width: 100%; padding: 0.85rem; background: var(--black); color: white;
      border: none; border-radius: 999px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; margin-bottom: 0.5rem;
    }
    .signin-btn:hover { background: var(--black-hover); transform: translateY(-1px); }
    .signin-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .auth-message { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 0.82rem; padding: 0.65rem 0.85rem; border-radius: 0.5rem; margin-bottom: 1.25rem; line-height: 1.5; }
    .auth-message.info { background: var(--bg-alt); border-color: var(--border); color: var(--ink); }

    .signup-link { text-align: center; font-size: 0.88rem; color: var(--ink-faint); margin-top: 1rem; }
    .signup-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .signup-link a:hover { color: var(--accent-dark); }
  </style>
</head>
<body>
  <div class="auth-topbar">
    <a href="index.html" class="logo">
      <svg class="logo-icon" viewBox="8 8 98 94" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="55" cy="55" r="42" fill="none" stroke="#712B13" stroke-width="8" stroke-linecap="round" stroke-dasharray="230 34" stroke-dashoffset="20"/>
        <path d="M92,33 Q101,45 95,52 Q97,43 89,41 Q86,48 92,53 Q80,50 80,40 Q80,34 92,33 Z" fill="#712B13"/>
      </svg>
      <span>EnrichMe</span>
    </a>
    <a href="index.html" class="back-home">← Back to home</a>
  </div>

  <div class="reset-shell">
    <div class="login-box">
      <h2>Set a new password</h2>
      <p class="subtitle" id="resetSubtitle">Choose a new password for your account.</p>

      <p class="auth-message" id="resetMessage" style="display:none;"></p>

      <form id="resetForm" onsubmit="handleResetSubmit(event)">
        <div class="form-group">
          <label>New password</label>
          <input type="password" placeholder="••••••••" id="newPassword" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm new password</label>
          <input type="password" placeholder="••••••••" id="confirmPassword" required minlength="6">
        </div>
        <button type="submit" class="signin-btn" id="resetSubmitBtn">Update Password</button>
      </form>

      <p class="signup-link" id="backToSignInWrap" style="display:none;">
        <a href="login.html">Back to sign in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    function showMessage(msg, type) {
      var el = document.getElementById('resetMessage');
      el.textContent = msg;
      el.className = 'auth-message' + (type === 'info' ? ' info' : '');
      el.style.display = 'block';
    }

    function lockToExpiredState() {
      document.getElementById('resetSubtitle').textContent = 'This reset link is invalid or has expired.';
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('backToSignInWrap').style.display = 'block';
      showMessage("This link isn't valid anymore — request a new one from the sign-in page.");
    }

    async function handleResetSubmit(event) {
      event.preventDefault();
      var newPassword = document.getElementById('newPassword').value;
      var confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showMessage('Those passwords don\'t match.');
        return;
      }

      var btn = document.getElementById('resetSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Updating…';

      try {
        var { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) throw error;

        showMessage('Password updated. Redirecting…', 'info');
        setTimeout(function () { window.location.href = 'dashboard.html'; }, 1200);
      } catch (err) {
        if (err.message && /session/i.test(err.message)) {
          lockToExpiredState();
        } else {
          showMessage(err.message || 'Could not update your password. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      }
    }

    // Supabase's client auto-parses the recovery token from the URL on load
    // and fires this event once that session is ready. If it never fires and
    // there's also no session shortly after, the link was likely already
    // used or has expired.
    supabaseClient.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') {
        showMessage("Link verified — choose a new password below.", 'info');
      }
    });

    setTimeout(async function () {
      var { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) lockToExpiredState();
    }, 2500);
  </script>
</body>
</html>
